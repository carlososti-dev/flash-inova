# Banco para desenvolvimento local: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: flash_inova
      POSTGRES_USER: flash_owner
      POSTGRES_PASSWORD: flash_owner
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
